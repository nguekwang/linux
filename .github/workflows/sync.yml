name: Sync upstream
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: automation
          fetch-depth: 1
          sparse-checkout: .github

      - name: Keepalive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $((45*86400)) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi

      - name: Sync
        id: sync
        run: |
          OLD=$(gh api repos/$REPO/branches/master --jq .commit.sha)
          gh repo sync $REPO --source torvalds/linux --branch master --force
          NEW=$(gh api repos/$REPO/branches/master --jq .commit.sha)
          echo "old=$OLD" >> $GITHUB_OUTPUT
          echo "new=$NEW" >> $GITHUB_OUTPUT

      - name: Collect commits
        id: collect
        if: steps.sync.outputs.old != steps.sync.outputs.new
        run: |
          gh api "repos/$REPO/compare/${{ steps.sync.outputs.old }}...${{ steps.sync.outputs.new }}" --paginate > raw.json
          jq -r '.commits[].commit.message | split("\n")[0]' raw.json > titles.txt
          jq -r '.commits[].commit.message, "-----"' raw.json | head -c 60000 > messages.txt

      - name: Summarize
        id: summarize
        if: steps.sync.outputs.old != steps.sync.outputs.new
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code
          if ! claude -p "The following is a list of new Linux kernel commit messages. Concisely summarize what changed and why, grouped by subsystem, in English, within 10 lines." < messages.txt > summary.md; then
            cat summary.md
            exit 1
          fi
          cat summary.md

      - name: Notify
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          OLD: ${{ steps.sync.outputs.old }}
          NEW: ${{ steps.sync.outputs.new }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          count=$(wc -l < titles.txt)
          subject="Linux updated: ${NEW:0:12} ($count commits)"
          {
            echo "From: Linux sync <$MAIL_FROM>"
            echo "To: $MAIL_TO"
            echo "Subject: =?UTF-8?B?$(printf '%s' "$subject" | base64 -w0)?="
            echo "Date: $(date -R)"
            echo "Message-ID: <$NEW.${{ github.run_id }}@${MAIL_FROM#*@}>"
            echo "MIME-Version: 1.0"
            echo "Content-Type: text/plain; charset=UTF-8"
            echo "Content-Transfer-Encoding: 8bit"
            echo
            if [ "${{ steps.summarize.outcome }}" = "success" ]; then
              cat summary.md
            else
              echo "Summary failed. See $RUN_URL"
            fi
            echo
            echo "Diff: ${{ github.server_url }}/$REPO/compare/$OLD...$NEW"
            echo
            echo "Commits ($count):"
            head -n 200 titles.txt | sed 's/^/- /'
          } > mail.eml
          if [ "$SMTP_PORT" = "465" ]; then url="smtps://$SMTP_HOST:465"; else url="smtp://$SMTP_HOST:${SMTP_PORT:-587}"; fi
          curl --silent --show-error --ssl-reqd --crlf --url "$url" \
            --user "$SMTP_USERNAME:$SMTP_PASSWORD" \
            --mail-from "$MAIL_FROM" --mail-rcpt "$MAIL_TO" \
            --upload-file mail.eml
